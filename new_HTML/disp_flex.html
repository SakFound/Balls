    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            *{
                margin: 0;
            }
            .background{
                width: 100%;
                height: 100vh;
                background-image: url(../crowIQ.png);
                background-repeat: no-repeat;
                display: flex;
                align-items: center;
                justify-content: center;
                background-position: center;
                background-size: cover;
                
            }
            .background>.card {
                width:500px;
                height: 50%;
                background-color: #edf6f9;
                border-radius: 30px;
                overflow: hidden;
                backdrop-filter: blur (10px);
                position: relative;
            }
            .card>.top{
                width: 500px;
                height: 33%;
                background-image: url(../monkeh.png);
                background-size: cover;
                background-repeat: no-repeat;
                position: relative
            }
            .top>.profile{
                width: 100px;
                height: 100px;
                background-color: #edf6f9;
                border-radius: 50%;
                position: absolute;
                top: 67px;
                left: 20px;
            }
            .username{
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 15px;
            }
            .user{
                font-size: 13px;
                color: grey;
            }
            .bio{
               width: 470px;
               height: 95%;
               background-color: #ffffff;
               display: flex;
               position: absolute;
               top: 230px;
               left: 15px;
               border-radius: 8px;
               border: 2px solid #8d99ae;
               padding: 15px;
               box-sizing: border-box;
            }
            .desc{
                font-size: 15px;
                text-align: justify;
                color: grey;
            }
            .follow {
                width: 100px;
                height: 30px;
                background-color: #2b2d42;
                position: absolute;
                right: 40px;
                top: 105px;
                border-radius: 15px;
                display: flex;
                justify-content: center;
                align-items: center;
                color: #edf6f9;

            }
            
            
        </style>
    </head>
    <body>
        <div class="background">
            <div class="card">
                <div class="top">
                    <div class="profile">
                            <img width="100px" height="100px" style="border-radius: 50%; border: 2px solid white;" src="../cat.png" alt="">
                            <h4 class="username">Certified_Jorker</h4>
                            <p class="user">@jorker_6000</p>
                            <img width="20px" height="20px" 
                            style="position: absolute;
                                    bottom: 134px;
                                    left: 450px;"
                            src="../more.png" alt="">
                            
                        </div>
                    <div class="bio"><p class="desc">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Inventore, temporibus dolorum, animi enim obcaecati explicabo nemo quam omnis recusandae perspiciatis porro sapiente debitis qui! At dolor voluptates veritatis voluptatum voluptate.</p>
                    </div>
                    <div class="follow">follow</div>
                    </div>
                    
            </div>
        </div>
    </body>
    </html>

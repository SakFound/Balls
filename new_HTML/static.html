<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           

        }
        .card {
            width: 300px;
            height: 450px;
            background-color: blueviolet;
            margin: 30px;
            border-radius: 20px;
            position: relative;
        }
        .top {
            width: 100%;
            height: 210px;
            background-color: rgb(255, 247, 0);
            border-radius: 20px;
        }
        .bottom {
            text-align: center;
            padding: 0 100px;
            padding-top: 50px;
            padding-bottom: 20px;


        }
        .name {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }
        .pos{
            font-size: 15px;
            font-weight: 10px;
            margin-bottom: 10px;
            color: rgb(255, 255, 255);
        }
        .profile {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            position: absolute;
            top: 150px;
            right: 105px;
            border: 3px solid rgb(255, 42, 191);
        }
        .desc {
            font-size: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
            color: white;
        }
        .social {
            width: 25px;
            height: 25px;
            object-fit: cover;
            margin-top: 10px;
            color: white;
        }

    </style>
</head>
<body>
    <div class="card">
        <img class="profile" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSS27FM8w8JuPjH6o0F7X23T5-PGm5PxEsrVDcU-ZOZ1Q&s=10" alt="">
        <div class="top"></div>
        <div class="bottom">
            <p class="name">Isolation</p>
            <p class="pos">Product Design</p>
            <hr style="border: 1px solid yellow;">
            <p class="desc"> baby watch it burn, turn it into isolation</p>
            <div>
                <img class="social" src="https://img.icons8.com/?size=100&id=84521&format=png&color=000000" alt="">
                <img class="social" src="https://img.icons8.com/?size=100&id=84521&format=png&color=000000" alt="">
                <img class="social" src="https://img.icons8.com/?size=100&id=84521&format=png&color=000000" alt="">
            </div>
        </div>
    </div>
</body>
</html>

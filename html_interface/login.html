<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .background{
            width: 100%;
            height: 100vh;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            background-position: center;
            background-size: cover;
        }
        .background>.card{
            width: 500px;
            height: 90%;
            background-color: white;
            border-radius: 10px;
            box-sizing: border-box;
            padding: 90px;
            position: relative;
            
        }
        .card>.header{
            font-size: 23px;
            font-family: sans-serif;
        }
        .card>.EnD{
            line-height: 60px;
            font-family: sans-serif;
            font-size: 14px;
            color: grey;
        }
        input{
            width: 100%;
            border-radius: 5px;
            height: 30px;
            border: 1px solid grey;
        }
        label{
            font-family: sans-serif;
            font-size: 14px;
        }
        
        a{ 
            text-decoration: none;
            color: black;
            font-family: sans-serif;
            font-size: 15px;
        }
        button{
            width: 100%;
            height: 30px;
            background-color: black;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .google{
            background-color: white;
            border: 1px solid grey;
            color: black;
            gap: 5px;
        }
        .signup{
            display: flex;
            align-items: center;
            gap: 5px;
            color: grey;
            line-height: 50px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="card">
            <h2 class="header">Welcome back</h2>
            <p class="EnD">Welcome back! Please enter your details.</p>
            <div class="email">
                <label for="email">Email</label><br>
                <input  type="email" name="email" placeholder="Enter your email"><br><br><br>
            </div>
            <div class="password">
                <label for="password">Password</label><br>
                <input type="password" name="password" placeholder="Enter your password"><br><br><br>
            </div>
            <div class="forgot"><a href="">Forgot password</a><br><br><br></div>
            <div class="login"><button>Login</button><br><br></div>
            <button class="google">
                <img width="15px" src="../imaage_stock/google.png" alt="">
                <span>Sign in with GOOGLE</span>
            </button><br>
            <div class="signup">
                <p>Don't have an account?</p>
                <a href="">Sign up here!</a>
            </div>
        </div>
    </div>
</body>
</html>
